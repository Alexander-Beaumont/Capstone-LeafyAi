services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - ./.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    environment:
      VITE_BACKEND_BASEURL: ${VITE_BACKEND_BASEURL:-http://127.0.0.1:8000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    depends_on:
      - backend
